name: Database CI

on:
  push:
    branches:
      - brian/full-system-integration
  pull_request:
    branches:
      - main
      - brian/full-system-integration

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db
